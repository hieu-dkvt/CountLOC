[project]
name = "loc-counter"
version = "0.1.0"
description = "Đếm LOC (chỉ dòng code) trên Git repository theo khoảng thời gian và theo user"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygments>=2.17",
    "requests>=2.31",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.12",
    "streamlit>=1.66",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
loc-counter = "loc_counter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loc_counter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
